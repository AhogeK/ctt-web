allowBuilds:
  msw: true
  simple-git-hooks: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@playwright/test@1.62.0'
  - '@vue/devtools-core@8.2.0'
  - '@vue/devtools-kit@8.2.0'
  - '@vue/devtools-shared@8.2.0'
  - playwright-core@1.62.0
  - playwright@1.62.0
  - vite-plugin-vue-devtools@8.2.0
  - '@intlify/core-base@11.4.8'
  - '@intlify/devtools-types@11.4.8'
  - '@intlify/message-compiler@11.4.8'
  - '@intlify/shared@11.4.8'
  - '@lucide/vue@1.27.0'
  - vue-i18n@11.4.8
peerDependencyRules:
  allowAny:
    - vue
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
