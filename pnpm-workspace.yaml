allowBuilds:
  msw: true
  simple-git-hooks: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@playwright/test@1.62.0'
  - '@vue/devtools-core@8.2.0'
  - '@vue/devtools-kit@8.2.0'
  - '@vue/devtools-shared@8.2.0'
  - playwright-core@1.62.0
  - playwright@1.62.0
  - vite-plugin-vue-devtools@8.2.0
peerDependencyRules:
  allowAny:
    - vue
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
