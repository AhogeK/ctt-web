allowBuilds:
  msw: true
  simple-git-hooks: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@vue/language-core@3.3.8'
  - lint-staged@17.1.1
  - vue-tsc@3.3.8
  - '@vitest/eslint-plugin@1.6.24'
peerDependencyRules:
  allowAny:
    - vue
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
