allowBuilds:
  msw: true
  simple-git-hooks: true
  vue-demi: true
# pnpm 11 defaults this to `install`: every `pnpm run`/`pnpm exec` then performs
# an implicit install whenever node_modules is out of sync. If that install meets
# a dependency whose build script has no decision, pnpm writes a NON-BOOLEAN
# placeholder for it into *this* tracked file, dirtying the tree and blocking
# later checkouts. `warn` reports the drift and never writes.
#
# Not `error`: a lone version bump already flips the workspace-state hash, so
# `error` would fail every script after a routine release step — a guard that
# cries wolf like that is a guard someone turns off.
verifyDepsBeforeRun: warn
minimumReleaseAgeExclude:
  - '@playwright/test@1.62.0'
  - '@vue/devtools-core@8.2.0'
  - '@vue/devtools-kit@8.2.0'
  - '@vue/devtools-shared@8.2.0'
  - playwright-core@1.62.0
  - playwright@1.62.0
  - vite-plugin-vue-devtools@8.2.0
  - '@intlify/core-base@11.4.8'
  - '@intlify/devtools-types@11.4.8'
  - '@intlify/message-compiler@11.4.8'
  - '@intlify/shared@11.4.8'
  - '@lucide/vue@1.27.0'
  - vue-i18n@11.4.8
  - eslint-plugin-playwright@2.11.0
  - jsdom@30.0.1
  - vite-plus@0.2.7
  - '@voidzero-dev/vite-plus-core@0.2.7'
  - '@voidzero-dev/vite-plus-darwin-arm64@0.2.7'
  - '@voidzero-dev/vite-plus-darwin-x64@0.2.7'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@0.2.7'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@0.2.7'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@0.2.7'
  - '@voidzero-dev/vite-plus-linux-x64-musl@0.2.7'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@0.2.7'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@0.2.7'
peerDependencyRules:
  allowAny:
    - vue
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
    # @vee-validate/zod still declares zod ^3.24.0, but zod 4 is a superset
    # (v3 API preserved) and the real-form integration tests exercise the
    # toTypedSchema chain against zod 4 — declaration lag, not a conflict.
    zod: '^4.4.3'
    # @opentelemetry/api 1.10.0 (latest) arrives via lighthouse's transitive Sentry
    # chain: @sentry/node@10.76.2 depends on the api as ^1.9.1, so the semver range
    # resolves up to 1.10.0, yet the same Sentry pins @opentelemetry/core@2.x whose
    # peer still caps the api at <1.10.0 — a self-contradictory upstream declaration
    # (first core that accepts 1.10.0 is 3.x, outside Sentry's ^2.9.0 pin). Dev
    # tooling only: OTel is not a direct dependency and app source never imports it;
    # type-check / build / the full unit suite run green with 1.10.0 installed.
    # Drop this once Sentry moves its OTel core pin to 3.x.
    '@opentelemetry/api': '>=1.0.0 <1.11.0'
