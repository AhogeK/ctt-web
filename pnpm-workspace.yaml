allowBuilds:
  msw: true
  simple-git-hooks: true
  vue-demi: true

peerDependencyRules:
  allowAny:
    - vue
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.5
  vitest: 4.1.10
  vite-plus: 0.2.5
  '@vitest/coverage-v8': 4.1.10
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
minimumReleaseAgeExclude:
  - '@vitest/eslint-plugin@1.6.23'
  - vue-router@5.2.0
  - '@lucide/vue@1.25.0'
  - lint-staged@17.1.0
